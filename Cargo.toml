[package]
name = "awsctl"
version = "1.0.5"
edition = "2021"
repository = "https://github.com/Souldiv/awsctl"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
inquire = "0.9.4"
aws-config = { version = "1.5.6", features = ["sso", "credentials-process", "behavior-version-latest"]}
aws-sdk-ssm = "1.110.0"
aws-sdk-sso = "1.18.0"
aws-sdk-ssooidc = "1.101.0"
serde = { version = "1.0", features = ["derive"] }
serde_ini = "0.2.0"
tokio = { version = "1", features = ["full"] }
clap = { version = "4.5.23", features = ["derive"] }
dirs = "7.0.0"
confy = "2.0.0"
webbrowser = "1.0.4"
anyhow = { version = "1.0.94", features = ["backtrace"] }
chrono = { version = "0.4.37", features = ["clock"] }
toml = "1.1.2"
aws-sdk-ec2 = "1.37.0"
serde_json = "1.0.140"
directories = "6.0.0"
rust-ini = "0.21.1"
sha1 = "0.11.0"
aws-sdk-eks = "1.49.0"
aws-sdk-rds = "1.73.0"
aws-smithy-types-convert = { version = "0.61.1" , features = ["convert-chrono"] }
kube-derive = { version = "4.0.0" }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.0.0", features = ["runtime", "derive"] }
schemars = { version = "1.2.1" }
rustls = { version = "0.23.40", features = ["aws-lc-rs"] }
