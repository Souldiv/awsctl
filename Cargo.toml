[package]
name = "awsctl"
version = "1.0.5"
edition = "2021"
repository = "https://github.com/Souldiv/awsctl"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
inquire = "0.9.4"
aws-config = { version = "1.13.0", features = ["sso", "credentials-process", "behavior-version-latest"]}
aws-sdk-ssm = "1.132.0"
aws-sdk-sso = "1.118.0"
aws-sdk-ssooidc = "1.120.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_ini = "0.2.0"
tokio = { version = "1.54.1", features = ["full"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
confy = "2.0.0"
webbrowser = "1.2.5"
anyhow = { version = "1.0.104", features = ["backtrace"] }
chrono = { version = "0.4.45", features = ["clock"] }
toml = "1.1.8"
aws-sdk-ec2 = "1.273.0"
serde_json = "1.0.154"
directories = "6.0.0"
rust-ini = "0.21.3"
sha1 = "0.11.0"
aws-sdk-eks = "1.159.0"
aws-sdk-rds = "1.158.0"
aws-smithy-types-convert = { version = "0.61.1" , features = ["convert-chrono"] }
kube-derive = { version = "4.2.0" }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", features = ["runtime", "derive"] }
schemars = { version = "1.2.3" }
rustls = { version = "0.23.46", features = ["aws-lc-rs"] }
